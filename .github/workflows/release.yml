name: Publish approved Binance OTA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.30 (run only after checking test build)"
        required: true
        type: string
      confirmation:
        description: "Xác nhận phát hành OTA cho người dùng"
        required: true
        type: choice
        options:
          - PUBLISH

permissions:
  contents: write

concurrency:
  group: binance-ota-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v0.30"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: false
      - name: Stamp approved app version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("src/main.go")
          content = path.read_text()
          version = os.environ["VERSION"]
          updated, n = re.subn(r'(?m)^(\s*appVersion\s*=\s*)"v[0-9]+\.[0-9]+"',
                               lambda m: m.group(1) + '"' + version + '"',
                               content, count=1)
          if n != 1:
              raise SystemExit("Could not stamp appVersion")
          path.write_text(updated)
          PY
      - name: Test and vet
        working-directory: src
        run: |
          go test ./...
          go vet ./...
      - name: Build static ARM64
        working-directory: src
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist/Apps/BinanceGia.pak
          go build -trimpath -ldflags="-s -w" -o ../dist/Apps/BinanceGia.pak/binance-gia .
      - name: Prepare release ZIP
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cp -a app/. dist/Apps/BinanceGia.pak/
          # Stock OS may not ship trusted HTTPS roots. Bundle system CA certificates.
          cp /etc/ssl/certs/ca-certificates.crt dist/Apps/BinanceGia.pak/cacert.pem
          test -f dist/Apps/BinanceGia.pak/config.json
          test -f dist/Apps/BinanceGia.pak/launch.sh
          test -f dist/Apps/BinanceGia.pak/icon.png
          chmod +x dist/Apps/BinanceGia.pak/launch.sh dist/Apps/BinanceGia.pak/binance-gia
          cd dist
          zip -q -r "../BinanceGia_TrimUI_StockOS_${VERSION}.zip" Apps
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ! gh release view "$VERSION" >/dev/null 2>&1 || { echo "Release already exists"; exit 1; }
          gh release create "$VERSION" "BinanceGia_TrimUI_StockOS_${VERSION}.zip" \
            --target "$GITHUB_SHA" --title "BINANCE $VERSION" \
            --notes "Read-only Binance Spot prices, chart indicators, and OTA for TrimUI Brick Pro Stock OS."
      - name: Publish verified manifest
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          v = os.environ["VERSION"]
          repo = os.environ["REPOSITORY"]
          file = Path(f"BinanceGia_TrimUI_StockOS_{v}.zip")
          assert file.is_file(), "Release ZIP missing"
          body = {
            "version": v,
            "url": f"https://github.com/{repo}/releases/download/{v}/{file.name}",
            "sha256": hashlib.sha256(file.read_bytes()).hexdigest(),
            "notes": f"BINANCE {v} — TrimUI Brick Pro Stock OS"
          }
          Path("manifest.json").write_text(json.dumps(body, indent=2, ensure_ascii=False) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.go manifest.json
          git commit -m "OTA: publish ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
